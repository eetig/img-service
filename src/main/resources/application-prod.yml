# ============================================================
# 生产环境配置（容器内生效，由 ENTRYPOINT 的 --spring.profiles.active=prod 激活）
# 所有地址均通过环境变量注入，换服务器/换域名不需要重新打 jar
# ============================================================
server:
  port: ${SERVER_PORT:8082}
  # 优雅停机：容器收到 SIGTERM 后先停止接收新请求，处理完在途请求再退出
  shutdown: graceful

spring:
  application:
    name: file-service

  lifecycle:
    timeout-per-shutdown-phase: 20s

  cloud:
    nacos:
      # 仅对「开了鉴权的 Nacos」需要填；留空=不传账密（本机 Nacos 未开鉴权，留空即可）。
      # 云 Nacos 开鉴权后由 1Panel 注入 NACOS_USERNAME / NACOS_PASSWORD（见 Nacos与FRP隧道说明.md 第 9 节）。
      # 注意：必须写在这一层（spring.cloud.nacos 下、与 discovery 同级）——
      #   discovery starter 的 NacosDiscoveryProperties 绑定的是 spring.cloud.nacos.username/password，
      #   写成 discovery.username / discovery.auth.username 均不生效（后者是 config 侧的旧写法）。
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        # 容器之间用容器名互访，不要写 127.0.0.1（那是容器自己）
        server-addr: ${NACOS_SERVER_ADDR:1Panel-nacos-qquH-standalone:8848}
        # Nacos 命名空间，留空=public。用命名空间隔离环境时必须填 namespace 的 ID（不是名称）
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        register-enabled: true

  servlet:
    multipart:
      # 与 application.yml 同口径：代码上限 10MB（ImgService.VESSEL_DRAWING_MAX_SIZE），
      # multipart 不能比它小，否则底图接口的 10MB 分支永远不可达（2026-10-15 code-review 的 Critical 1）。
      max-file-size: 10MB
      max-request-size: 12MB

# ------------------------------------------------------------
# MinIO
#
# ⚠️ endpoint 是**服务端内部**地址（file-service → MinIO），不是给浏览器用的 ——
#    生产应填**同一 docker 网络里的容器名**，例如：
#        MINIO_ENDPOINT=http://<minio容器名>:9000
#    填公网域名（frp 映射）会让每张图多绕一次公网：
#        容器 → 宿主 → 公网中转 → frp 隧道 → 回到宿主 → MinIO
#    两端明明在同一台机器上，却要占家里最稀缺的**上行带宽**，还与同一个隧道里的
#    ssh / mysql / redis / 各服务端口抢带宽。2026-10-16 性能审查实测：
#    4.1MB 图上传 8.68s、下载 8.62s ⇒ 约 3.75 Mbps —— 全被这条绕行吃掉。
#
# 为什么以前必须填公网域名（**该理由现在不成立了**）：
#    旧前端直接拿 getPresignedObjectUrl() 的链接显示图片，而预签名 URL 里的 host
#    就是 endpoint，写容器名浏览器解析不了。该路径已废弃：
#      · 前端/手机端现在一律用 file-service 自己提供的 /files/xxx、/thumbs/xxx
#        （相对路径，由 file-service 或 Nginx 提供），浏览器根本不直连 MinIO；
#      · /api/img/getPreviewUrl 已无任何调用方（前后端改动统筹.md 记为"保留作为回退"）。
#    ⚠️ 别把这条内部 endpoint 与 hnd_factory 的 IMAGE_BASE_URL 混为一谈：后者是浏览器
#       要用的对外地址，**必须**保持公网可达，两者各管一段、不要互相看齐。
#
# 若将来又要给浏览器用预签名 URL：endpoint 必须重新公网可达；minio-java 没有
#   "单次请求覆盖 host"的入口，届时正确做法是**再建一个**用公网 endpoint 的
#   MinioClient 专职签名，而不是把内部读写路径也改回公网。
# ------------------------------------------------------------
minio:
  endpoint: ${MINIO_ENDPOINT:http://124.220.60.154:9025}
  # 生产凭据由 1Panel 环境变量 MINIO_ACCESS_KEY / MINIO_SECRET_KEY 注入，仓库内不落盘
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:hndfactory}


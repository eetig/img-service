logging:
  level:
    root: info
    org.example: info
  file:
    # 输出到挂载目录，1Panel 里可持久化到宿主机
    name: /app/logs/img-service.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 15
      total-size-cap: 500MB

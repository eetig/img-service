# ============================================================
# 生产环境配置（容器内生效，由 ENTRYPOINT 的 --spring.profiles.active=prod 激活）
# 所有地址均通过环境变量注入，换服务器/换域名不需要重新打 jar
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  # 优雅停机：容器收到 SIGTERM 后先停止接收新请求，处理完在途请求再退出
  shutdown: graceful

spring:
  application:
    name: img-service

  lifecycle:
    timeout-per-shutdown-phase: 20s

  cloud:
    nacos:
      discovery:
        # 容器之间用容器名互访，不要写 127.0.0.1（那是容器自己）
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        # Nacos 命名空间，留空=public。用命名空间隔离环境时必须填 namespace 的 ID（不是名称）
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        register-enabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# ------------------------------------------------------------
# MinIO
# 注意：endpoint 必须填「浏览器能访问到的公网域名」，不能填容器名。
# 原因：MinioClient.getPresignedObjectUrl() 生成的预签名 URL 里的 host 就是 endpoint，
#       这个 URL 会返回给前端浏览器，写容器名浏览器无法解析。
#       详见交付步骤里的「坑点 1」。
# ------------------------------------------------------------
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:hndfactory}


server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: img-service
  cloud:
    nacos:
      # 仅对「开了鉴权的 Nacos」需要填；留空=不传账密（本机 Nacos 未开鉴权，留空即可）。
      # 云 Nacos 开鉴权后由 1Panel 注入 NACOS_USERNAME / NACOS_PASSWORD（见 Nacos与FRP隧道说明.md 第 9 节）。
      # 注意：必须写在这一层（spring.cloud.nacos 下、与 discovery 同级）——
      #   discovery starter 的 NacosDiscoveryProperties 绑定的是 spring.cloud.nacos.username/password，
      #   写成 discovery.username / discovery.auth.username 均不生效（后者是 config 侧的旧写法）。
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        # 本地开发默认连本机 Nacos（127.0.0.1:8848）
        # 容器部署由 application-prod.yml 覆盖为 1Panel 的容器名，此处不影响生产
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

minio:
  # 预签名 URL 的对外访问地址：必须是「客户端能访问到的」地址，
  # 因为 getPresignedObjectUrl() 生成的链接里 host 就是 endpoint，该链接会返回给浏览器。
  # 现指向 PC2 上 1Panel 部署的 MinIO 的 S3 API 端口（9025，不是控制台端口）。
  # 容器部署时由 1Panel 环境变量 MINIO_ENDPOINT 注入并覆盖此默认值。
  # 凭据不落盘到仓库，通过外部注入：
  #   本地：项目根 config/application.yml（已 gitignore，自动生效，无需 profile）
  #   生产：1Panel 环境变量（优先级最高）
  endpoint: ${MINIO_ENDPOINT:http://124.220.60.154:9025}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:hndfactory}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    // 明确按 Java 21 编译，避免 IDEA / 服务器 JDK 版本不一致导致 UnsupportedClassVersionError
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven { url 'https://maven.aliyun.com/repository/spring' }
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.0"
        mavenBom "com.alibaba.cloud:spring-cloud-alibaba-dependencies:2025.0.0.0"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.minio:minio:8.5.7'
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    // 源码含中文（异常文案），必须 UTF-8，否则服务器/CI 编译出现乱码
    options.encoding = 'UTF-8'
}

// 禁用普通 jar：build/libs 下只保留一个可执行 jar，Dockerfile 的 COPY 才不会歧义
tasks.named('jar') {
    enabled = false
}

// 固定产物文件名，让 Dockerfile 里 COPY 的路径稳定、不随版本号变化
bootJar {
    archiveFileName = 'img-service.jar'
    // 便于在服务器上确认镜像内跑的到底是哪次构建
    manifest {
        attributes(
                'Implementation-Title': 'img-service',
                'Implementation-Version': project.version,
                'Build-Time': new Date().format("yyyy-MM-dd HH:mm:ss")
        )
    }
}
